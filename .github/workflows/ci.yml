# Revisión automática: lint, tipos, tests unitarios y build en cada push a
# `dev` y `main` y en cada pull request. No toca Supabase: el build solo
# necesita que las variables existan, así que van valores de mentira.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-mentira-para-el-build
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        # next-env.d.ts (tipos de imágenes importadas, rutas) no se versiona:
        # se genera con `next typegen` antes de revisar los tipos.
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
