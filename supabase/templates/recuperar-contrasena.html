<!--
  Supabase → Authentication → Emails → Reset password
  Asunto: Elige una contraseña nueva

  Igual que confirmar-cuenta.html: token_hash para que el enlace sirva en
  cualquier dispositivo. {{ .RedirectTo }} ya es
  `https://<dominio>/api/auth/confirmar?next=/<idioma>/restablecer`.
-->
<h2>¿Olvidaste tu contraseña?</h2>
<p>Pasa, que la puerta sigue abierta: elige una nueva desde aquí.</p>
<p><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery">Elegir contraseña nueva</a></p>
<p>Si no lo pediste tú, ignora este mensaje: tu contraseña no cambia.</p>
